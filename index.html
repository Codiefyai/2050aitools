        .site-title span:nth-child(3) { color: yellow; animation-delay: 0.2s;}

        .site-title span:nth-child(10) { color: yellow; animation-delay: 0.9;}
        .site-title span:nth-child(11) { color: green; animation-delay: 1s;}
        .site-title span:nth-child(12) { color: blue; animation-delay: 1.1s;}

        @keyframes bounce {
            from { transform: translateY(0px); }
            to   { transform: translateY(-20px); }
        }


        .tabs {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #ff99c8;
            margin: 5px;
            border-radius: 5px;
            white-space: nowrap;
        }
        .tab.active {
            background-color: #ff66a3;
            color: white;
        }
        .category {
            display: none;
            margin: 40px auto;
            width: 90%;
        }
        .category.active {
            display: block;
        }

        /* Grid Styles */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            justify-content: center;
        }

        .video-tile {
            position: relative;
            border: 2px solid #ff66a3;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .video-tile:hover{
            transform: scale(1.05);
        }

        .video-tile img {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-title {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.8);
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
        }

        .video-description {
            padding: 5px;
            text-align: center;
            font-size: 0.9em;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 153, 200, 0.8);
            color: #333;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .video-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            display: none;
            z-index: 2;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .video-preview video{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-tile:hover .video-preview {
            display: block;
        }

        /* Footer Styles */
        footer {
            background-color: #ff99c8;
            color: white;
            padding: 10px;
            margin-top: 30px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* --- Modal Styles (Adjustments) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            position: relative; /* Added: for absolute positioning of the close button */
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            animation-name: modalopen;
            animation-duration: 0.4s;
        }

        /* Modal Open Animation */
        @keyframes modalopen {
            from {opacity: 0}
            to {opacity: 1}
        }

        .modal input[type="text"], .modal input[type="email"], .modal textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        .modal textarea{
            height: 150px;
        }

        .modal button {
            background-color: #ff99c8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 10px;
        }
        .modal button.close-button {
            background-color: #ccc;
        }

        .modal button:hover {
            opacity: 0.8;
        }

        .open-modal-btn {
            background-color: #ff66a3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 20px;
        }
        .open-modal-btn:hover {
            opacity: 0.8;
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }

        .close-button:hover {
            color: black;

    function createTabs() {
        const tabsContainer = document.getElementById('tabs');
        Object.keys(categories).forEach((category, index) => {
            const tab = document.createElement('div');
            tab.className = 'tab' + (index === 0 ? ' active' : '');
            tab.innerText = category;
            tab.onclick = () => showCategory(category);
            tabsContainer.appendChild(tab);
        });
    }

    function createGrid(category, videos) {
        let section = `<div class='category${category === Object.keys(categories)[0] ? ' active' : ''}' id='${category}'>
            <h2>${category}</h2>
            <div class='video-grid'>`;

        videos.forEach(video => {
            const videoId = video.url.split('v=')[1];
            const previewUrl = `https://www.youtube.com/embed/${videoId}?start=0&end=6&autoplay=1&mute=1&loop=1&controls=0`;
            const requester = getRandomRequester(); // Get a unique requester

            section += `
        <div class='video-tile' onclick="window.open('${video.url}', '_blank')">
            <img src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg' alt='${video.title}'>
            <div class='video-title'>${video.title}</div><div class='video-description'>${requester}</div>
            <div class='video-preview'>
                <video src="${previewUrl}" autoplay loop muted></video>
            </div>
        </div>`;
        });
        section += "</div></div>";
        document.getElementById("episodes").innerHTML += section;}

    function showCategory(category) {
        document.querySelectorAll('.category').forEach(cat => cat.classList.remove('active'));
        document.getElementById(category).classList.add('active');
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        const tabs = Array.from(document.querySelectorAll('.tab'));
        const targetTab = tabs.find(tab => tab.innerText === category);
        if (targetTab) targetTab.classList.add('active');
    }

    $(document).ready(function(){
        createTabs();
        usedRequesters.clear();
        Object.keys(categories).forEach(category => {
            createGrid(category, categories[category]);
        });

        // --- Modal JavaScript ---
        const modal = document.getElementById('submissionModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeButtons = document.querySelectorAll('.close-button'); // Select all close buttons
        const loadingIndicator = document.getElementById('loadingIndicator');
        const form = document.getElementById('videoSubmissionForm');

        openModalBtn.onclick = function() {
            loadingIndicator.style.display = "block"; // Show loading indicator
            setTimeout(function() { // Simulate loading delay
                loadingIndicator.style.display = "none"; // Hide loading indicator
                modal.style.display = "block"; // Show modal
            }, 500); // Adjust the delay (milliseconds) as needed
        }

        closeButtons.forEach(button => { // Loop through each close button
            button.onclick = function() {
                modal.style.display = "none";
            }
        });

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // --- EmailJS Integration ---
        form.addEventListener('submit', function(event) {
            console.log("Submit button clicked!");
            event.preventDefault(); // Prevent the default form submission

            // Disable the submit button to prevent multiple submissions
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';

            //Collect form data
            const youtubeLink = document.getElementById('youtubeLink').value;
            const episodeName = document.getElementById('episodeName').value;
            const babyName = document.getElementById('babyName').value;
            const mommyEmail = document.getElementById('mommyEmail').value;
            const description = document.getElementById('description').value;

            //Validate recaptcha
            const recaptchaResponse = grecaptcha.getResponse();
            if (!recaptchaResponse) {
                alert("Please complete the reCAPTCHA to verify you're human.");
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Suggestion';
                return;
            }

            // Send email using EmailJS
            emailjs.send("service_l2p4i2j", "template_j9eb828", { // Replace with your Service ID and Template ID
                youtubeLink: youtubeLink,
                episodeName: episodeName,
                babyName: babyName,
                mommyEmail: mommyEmail,
                description: description
            })
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);
                    alert('Suggestion submitted successfully!');

                    // Re-enable the submit button
                    submitButton.disabled = false;
                    submitButton.textContent = 'Submit Suggestion';

                    //Close Modal
                    modal.style.display = "none";
                    // Clear the form fields
                    form.reset();
                     grecaptcha.reset(); // Reset reCAPTCHA

                }, function(error) {
                    console.error('FAILED...', error);
                    alert('Suggestion submission failed.  Please try again.');
                    // Re-enable the submit button
                    submitButton.disabled = false;
                    submitButton.textContent = 'Submit Suggestion';

                });

        });
    });
</script>
