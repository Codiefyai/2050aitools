<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading VirtuCall PH Tracker...</title>
    <link rel="icon" href="https://i.ibb.co/67gPjyKt/Virtu-Call-favicon.png" type="image/png">
    <style>
        /* Basic Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden; /* Prevent scrollbars during loading */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* Stack logo and text vertically */
            background-color: #f4f7f9; /* Match app background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #495057; /* Subdued text color */
        }

        .loader-container {
            text-align: center;
        }

        .logo {
            width: 80px; /* Adjust size as needed */
            height: 80px;
            border-radius: 50%;
            margin-bottom: 25px;
            /* Animation applied below */
            animation: pulse 1.8s infinite ease-in-out;
        }

        .loading-text {
            font-size: 1.1em;
            color: #0056b3; /* VirtuCall Blue */
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Simple pulsing animation for the logo */
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.08);
                opacity: 0.85;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Optional: Fade out transition before redirect (can feel smoother) */
        body.fade-out {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }

    </style>
</head>
<body>

    <div class="loader-container">
        <img src="https://i.ibb.co/67gPjyKt/Virtu-Call-favicon.png" alt="VirtuCall PH Loading..." class="logo">
        <p class="loading-text">Initializing Tracker...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const redirectUrl = 'https://apps-virtucallph-tracker.onrender.com'; // The target URL

            // Calculate random duration between 1000ms (1s) and 6000ms (6s)
            const minDuration = 1000;
            const maxDuration = 6000;
            const randomDuration = Math.floor(Math.random() * (maxDuration - minDuration + 1)) + minDuration;

            console.log(`Loading screen showing for ${randomDuration}ms`); // For debugging

            // Set timeout to redirect after the random duration
            setTimeout(() => {
                // Optional: Add fade-out effect before redirecting
                document.body.classList.add('fade-out');

                // Wait slightly for fade-out animation before actually redirecting
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 500); // Matches the CSS transition duration

            }, randomDuration);
        });
    </script>

</body>
</html>
