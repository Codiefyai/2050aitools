<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Bah! Bah's! Corner</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #ffebf0;
            text-align: center;
        }
        .thank-you {
            font-size: 2em;
            font-weight: bold;
            display: inline-block;
            background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 2s infinite alternate;
        }
        @keyframes rainbow {
            from { filter: hue-rotate(0deg); }
            to { filter: hue-rotate(360deg); }
        }
        .message {
            font-size: 1.2em;
            color: #333;
            margin-top: 20px;
        }
        .back-button {
            background-color: #ff66a3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }
        .back-button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1 class="thank-you">Thank You for Submitting!</h1>
    <p class="message">We will notify you today once your child's favorite YouTube episode is up! Keep sharing more episodes to help other parents find amazing content!</p>
    <button class="back-button" onclick="window.location.href='https://babahs-corner.onrender.com/'">Back to Home</button>
</body>
</html>
