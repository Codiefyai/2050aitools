<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Password Generator</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 1rem;
        }
        input[type="number"], input[type="checkbox"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1rem;
        }
        button {
            background: #00bcd4;
            color: #fff;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #0097a7;
        }
        #result {
            margin-top: 20px;
            font-size: 1.2rem;
            text-align: center;
            word-wrap: break-word;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .checkbox-container label {
            margin-left: 10px;
        }
        .copy-btn {
            margin-top: 10px;
            background: #4CAF50;
        }
        .copy-btn:hover {
            background: #45a049;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Advanced Password Generator</h1>
        <label for="length">Password Length:</label>
        <input type="number" id="length" placeholder="Enter length (8-64 characters)" min="8" max="64">
        <div class="checkbox-container">
            <input type="checkbox" id="include-special" checked>
            <label for="include-special">Include Special Characters</label>
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="exclude-similar">
            <label for="exclude-similar">Exclude Similar Characters (e.g., O, 0, l, I)</label>
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="exclude-repeats">
            <label for="exclude-repeats">Exclude Repeated Characters</label>
        </div>
        <button id="generate-btn">Generate Password</button>
        <div id="result"></div>
        <button id="copy-btn" class="copy-btn" style="display: none;">Copy Password</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("generate-btn").addEventListener("click", generatePassword);
            document.getElementById("copy-btn").addEventListener("click", copyPassword);
        });

        function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            const includeSpecial = document.getElementById('include-special').checked;
            const excludeSimilar = document.getElementById('exclude-similar').checked;
            const excludeRepeats = document.getElementById('exclude-repeats').checked;
            const result = document.getElementById('result');
            const copyBtn = document.getElementById('copy-btn');

            if (isNaN(length) || length < 8 || length > 64) {
                result.textContent = 'Please enter a valid length between 8 and 64 characters.';
                result.style.color = 'red';
                copyBtn.style.display = 'none';
                return;
            }

            const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowercase = 'abcdefghijklmnopqrstuvwxyz';
            const numbers = '0123456789';
            const special = '!@#$%^&*()_+[]{}|;:,.<>?';

            let allCharacters = uppercase + lowercase + numbers;

            if (includeSpecial) {
                allCharacters += special;
            }

            if (excludeSimilar) {
                allCharacters = allCharacters.replace(/[O0lI]/g, '');
            }

            let password = '';
            let usedCharacters = new Set();

            if (includeSpecial) {
                password += special[Math.floor(Math.random() * special.length)];
                usedCharacters.add(password[0]);
            }
            
            while (password.length < length - 2) {
                const char = allCharacters[Math.floor(Math.random() * allCharacters.length)];
                if (excludeRepeats && usedCharacters.has(char)) {
                    continue;
                }
                password += char;
                usedCharacters.add(char);
            }

            password += lowercase[Math.floor(Math.random() * lowercase.length)];
            password += numbers[Math.floor(Math.random() * numbers.length)];
            password = password.split('').sort(() => 0.5 - Math.random()).join('');

            result.textContent = password;
            result.style.color = 'lightgreen';
            copyBtn.style.display = 'block';
        }

        function copyPassword() {
            const passwordText = document.getElementById('result').textContent;
            if (!passwordText) return;

            navigator.clipboard.writeText(passwordText).then(() => {
                alert("Password copied to clipboard!");
            }).catch(err => {
                console.error("Error copying password: ", err);
                alert("Failed to copy password. Please try again.");
            });
        }
    </script>
</body>
</html>
