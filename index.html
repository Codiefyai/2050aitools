<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggest a Video - Bah! Bah's! Corner</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #ffebf0;
            text-align: center;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            position: relative;
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            animation-name: modalopen;
            animation-duration: 0.4s;
        }

        @keyframes modalopen {
            from {opacity: 0}
            to {opacity: 1}
        }

        .modal h2 {
            color: #ff66a3;
        }

        .modal input, .modal textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        .modal textarea {
            height: 150px;
        }

        .modal button {
            background-color: #ff99c8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 10px;
        }

        .modal button.close-button {
            background-color: #ccc;
        }

        .modal button:hover {
            opacity: 0.8;
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            padding: 0;
            margin: 0;
        }

        .close-button:hover {
            color: black;
        }

        #loadingIndicator {
            display: none;
            font-size: 1.2em;
            color: #ff66a3;
            margin-bottom: 20px;
        }
    </style>
    <script src="https://www.google.com/recaptcha/enterprise.js?render=6Ldc-d4qAAAAAINg0gRL_2ylHQRkcjg-_eIxIkbS"></script>
</head>
<body>

<div id="loadingIndicator">Loading...</div>

<button onclick="openModal()">Suggest an Episode</button>

<div id="submissionModal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="closeModal()">×</span>
        <h2>Suggest an Episode</h2>
        <form id="videoSubmissionForm">
            <input type="text" id="youtubeLink" name="youtubeLink" placeholder="YouTube Link" required>
            <input type="text" id="episodeName" name="episodeName" placeholder="Episode/Video Name" required>
            <input type="text" id="babyName" name="babyName" placeholder="Baby's Name (Optional)">
            <input type="email" id="mommyEmail" name="mommyEmail" placeholder="Parent's Email (for notifications)" required>
            <textarea id="description" name="description" placeholder="Why loving this video? (Optional)"></textarea>
            <br/>
            <button type="submit" id="submitSuggestionButton">Submit Suggestion</button>
            <button type="button" class="close-button" onclick="closeModal()">Close</button>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>

<script>
    window.onload = function() {
        emailjs.init("cAOXhnd37_jzIQcVJ");
    };

    function openModal() {
        document.getElementById('submissionModal').style.display = "block";
    }

    function closeModal() {
        document.getElementById('submissionModal').style.display = "none";
    }

    document.getElementById("videoSubmissionForm").addEventListener("submit", function(event) {
        event.preventDefault(); 

        const submitButton = document.getElementById('submitSuggestionButton');
        submitButton.disabled = true;
        submitButton.textContent = 'Verifying...';

        grecaptcha.enterprise.ready(async () => {
            const token = await grecaptcha.enterprise.execute('6Ldc-d4qAAAAAINg0gRL_2ylHQRkcjg-_eIxIkbS', { action: 'submit_suggestion' });
            sendEmail();
        });
    });

    function sendEmail() {
        const youtubeLink = document.getElementById('youtubeLink').value;
        const episodeName = document.getElementById('episodeName').value;
        const babyName = document.getElementById('babyName').value;
        const mommyEmail = document.getElementById('mommyEmail').value;
        const description = document.getElementById('description').value;

        const submitButton = document.getElementById('submitSuggestionButton');

        emailjs.send("service_l2p4i2j", "template_j9eb828", {
            youtubeLink: youtubeLink,
            episodeName: episodeName,
            babyName: babyName,
            mommyEmail: mommyEmail,
            description: description
        })
        .then(function(response) {
            alert('Suggestion submitted successfully!');
            document.getElementById('videoSubmissionForm').reset();
            closeModal();
            submitButton.disabled = false;
            submitButton.textContent = 'Submit Suggestion';
        }, function(error) {
            alert('Submission failed. Please try again.');
            submitButton.disabled = false;
            submitButton.textContent = 'Submit Suggestion';
        });
    }
</script>

</body>
</html>
