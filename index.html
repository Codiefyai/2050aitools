<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading NM Daily Tracker...</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/RTh47BBZ/northwestern-mutual-logo.jpg">
    <style>
        :root {
            --nm-blue: #00205b;
            --light-gray: #ecf0f1;
            --dark-gray: #34495e;
            --white: #ffffff;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--nm-blue); /* NM Blue background */
            color: var(--light-gray);
            overflow: hidden; /* Prevent scrollbars during loading */
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .logo-container {
            width: 150px; /* Adjust size as needed */
            max-width: 80%;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
             filter: brightness(1.2); /* Make white logo slightly brighter */
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3); /* Light border */
            border-top-color: var(--white); /* White spinner top */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #loading-message {
            font-size: 1.1rem;
            font-weight: 500;
            min-height: 1.5em; /* Prevent layout shift when text changes */
        }

        /* Fallback for no JavaScript */
        noscript .loading-container {
            justify-content: flex-start; /* Align top */
            padding-top: 50px;
        }
         noscript .spinner {
            display: none;
         }
        noscript #loading-message {
            display: none;
        }
        noscript .manual-link {
            display: block;
            margin-top: 30px;
            font-size: 1rem;
            color: var(--white);
            text-decoration: underline;
        }
         noscript .manual-link:hover {
             color: var(--light-gray);
         }

    </style>
</head>
<body>

    <div class="loading-container">
        <div class="logo-container">
            <img src="https://www.pngkey.com/png/detail/142-1420424_northwestern-mutual-logo-white-northwestern-mutual-logo.png" alt="Northwestern Mutual Logo">
        </div>
        <div class="spinner"></div>
        <p id="loading-message">Initializing...</p>
    </div>

    <noscript>
         <div class="loading-container">
             <div class="logo-container">
                 <img src="https://www.pngkey.com/png/detail/142-1420424_northwestern-mutual-logo-white-northwestern-mutual-logo.png" alt="Northwestern Mutual Logo">
             </div>
            <p>JavaScript is required to load the application automatically.</p>
            <a href="https://app-nmdailytracker.onrender.com" class="manual-link">Click here to continue to the NM Daily Tracker</a>
        </div>
    </noscript>

    <script>
        (function() {
            const targetUrl = "https://app-nmdailytracker.onrender.com";
            const maxLoadTime = 6000; // 6 seconds in milliseconds
            const messageElement = document.getElementById('loading-message');

            const loadingMessages = [
                "Connecting to servers...",
                "Loading application data...",
                "Initializing tracker components...",
                "Setting up interface...",
                "Fetching latest updates...",
                "Preparing dashboard...",
                "Almost ready..."
            ];

            let messageIntervalId = null;

            // Function to update the loading message randomly
            function updateMessage() {
                const randomIndex = Math.floor(Math.random() * loadingMessages.length);
                if (messageElement) {
                    messageElement.textContent = loadingMessages[randomIndex];
                }
            }

            // Function to redirect to the main application
            function redirectToApp() {
                if (messageIntervalId) {
                    clearInterval(messageIntervalId); // Stop changing messages
                }
                 // Add a very small delay just before redirecting for perceived smoothness
                setTimeout(() => {
                   window.location.href = targetUrl;
                }, 100);
            }

            // Start changing messages periodically
            messageIntervalId = setInterval(updateMessage, 800); // Change message every 800ms

            // Set a timeout to redirect after the maximum load time
            setTimeout(redirectToApp, maxLoadTime);

            // Optional: If there were a real loading process, you could potentially
            // call redirectToApp() earlier if the loading finishes before maxLoadTime.
            // Example:
            // someAsyncTask().then(() => {
            //     console.log("Loading complete, redirecting early.");
            //     redirectToApp();
            // }).catch(error => {
            //     console.error("Loading error:", error);
            //     // Still redirect after max time, or show an error message
            // });

        })();
    </script>

</body>
</html>
