<!DOCTYPE html>
<html lang="en" class="dark-mode"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗣️ Free Text-to-Speech Tool (Dark Mode Default) 🗣️</title>
    <style>
        :root {
            /* Dark Mode Colors (Default) */
            --body-bg-color: #121212;
            --text-color: #f0f0f0;
            --heading-color: #00bcd4; /* Cyan/Teal for heading */
            --paragraph-color: #ccc;
            --container-bg-color: #222;
            --container-border-color: #444;
            --footer-text-color: #aaa;
            --footer-border-color: #555;
            --button-bg-color: #00bcd4;
            --button-text-color: #121212;
            --button-hover-bg-color: #008ba7;
        }

        /* Light Mode Colors (Overridden by .light-mode class) */
        .light-mode {
            --body-bg-color: #f0f2f5;
            --text-color: #333;
            --heading-color: #007bff; /* Blue for heading in light mode */
            --paragraph-color: #555;
            --container-bg-color: white;
            --container-border-color: #ddd;
            --footer-text-color: #777;
            --footer-border-color: #eee;
            --button-bg-color: #007bff;
            --button-text-color: white;
            --button-hover-bg-color: #0056b3;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--body-bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: background-color 0.3s ease, color 0.3s ease; /* Smooth transitions */
        }

        h1 {
            color: var(--heading-color);
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 20px;
            color: var(--paragraph-color);
        }

        .gradio-container {
            width: 95%;
            max-width: 700px;
            margin-bottom: 20px;
            border: 1px solid var(--container-border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            background-color: var(--container-bg-color);
            padding: 20px;
            transition: background-color 0.3s ease, border-color 0.3s ease; /* Smooth transitions */
        }

        gradio-app {
            display: block;
            width: 100%;
        }

        footer {
            margin-top: 30px;
            padding: 10px;
            font-size: 0.9em;
            color: var(--footer-text-color);
            border-top: 1px solid var(--footer-border-color);
            transition: color 0.3s ease, border-color 0.3s ease; /* Smooth transitions */
        }

        /* Toggle Button Styles */
        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--button-bg-color);
            color: var(--button-text-color);
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.3s ease, color 0.3s ease; /* Smooth transitions */
        }

        #theme-toggle:hover {
            background-color: var(--button-hover-bg-color);
        }
    </style>
</head>
<body class="dark-mode">  <button id="theme-toggle">Light Mode</button>

    <h1>🗣️ Free Online Text-to-Speech 🗣️</h1>
    <p>Enter text below and make it speak! Dark mode is default. Toggle button to switch to light mode.</p>

    <div class="gradio-container">
        <script
            type="module"
            src="https://gradio.s3-us-west-2.amazonaws.com/5.9.1/gradio.js"
        ></script>
        <gradio-app src="https://innoai-edge-tts-text-to-speech.hf.space"></gradio-app>
    </div>

    <footer>
        <p>Powered by a free Text-to-Speech model hosted on Hugging Face Spaces. Enjoy listening!</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const body = document.body;

            themeToggleBtn.addEventListener('click', () => {
                body.classList.toggle('light-mode');
                if (body.classList.contains('light-mode')) {
                    themeToggleBtn.textContent = 'Dark Mode';
                    localStorage.setItem('theme', 'light-mode'); // Store preference
                } else {
                    themeToggleBtn.textContent = 'Light Mode';
                    localStorage.setItem('theme', 'dark-mode'); // Store preference
                }
            });

            // Check for saved theme preference on page load
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light-mode') {
                body.classList.add('light-mode');
                themeToggleBtn.textContent = 'Dark Mode';
            } else {
                // Default is dark mode (no need to add class if default)
                themeToggleBtn.textContent = 'Light Mode';
            }
        });
    </script>
</body>
</html>
